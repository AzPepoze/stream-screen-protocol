services:
     echo:
          build:
               context: ../..
               dockerfile: tests/netem/Dockerfile.smoke
          container_name: csp-netem-echo
          environment:
               LISTEN_ADDR: ":7700"

     relay:
          depends_on:
               - echo
          environment:
               TARGET_ADDR: "echo:7700"
               NETEM_PRESET: "custom"
               NETEM_DELAY: "50ms"
               NETEM_JITTER: "5ms"
               NETEM_LOSS: "5%"
               NETEM_DUPLICATE: "0%"
               NETEM_RATE: ""
