services:
     relay:
          build:
               context: ../..
               dockerfile: tests/netem/Dockerfile
          container_name: csp-netem-relay
          cap_add:
               - NET_ADMIN
          restart: unless-stopped
          extra_hosts:
               - "host.docker.internal:host-gateway"
          ports:
               - "${RELAY_PORT:-5000}:5000/udp"
          environment:
               LISTEN_ADDR: ":5000"
               TARGET_ADDR: "${TARGET_ADDR:-host.docker.internal:7700}"
               IDLE_TIMEOUT: "${IDLE_TIMEOUT:-2m}"
               # Preset options:
               #   - "wifi"      (default) : 20ms ± 2ms, 0.5% loss
               #   - "lan"                 : 0ms, 0% loss (transparent)
               #   - "broadband"           : 10ms ± 1ms, 0.1% loss
               #   - "mobile"              : 80ms ± 15ms, 3.0% loss
               #   - "bad"                 : 150ms ± 30ms, 8.0% loss
               #   - "extreme"             : 250ms ± 50ms, 15.0% loss, 10Mbps
               #   - "custom"              : use NETEM_DELAY, NETEM_LOSS, etc. below
               NETEM_PRESET: "${NETEM_PRESET:-wifi}"
               NETEM_DELAY: "${NETEM_DELAY:-20ms}"
               NETEM_JITTER: "${NETEM_JITTER:-2ms}"
               NETEM_LOSS: "${NETEM_LOSS:-0.5%}"
               NETEM_DUPLICATE: "${NETEM_DUPLICATE:-0%}"
               NETEM_RATE: "${NETEM_RATE:-}"
